<!doctype html>
<html lang="vi">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
        <meta name="theme-color" content="#10081d" />
        <meta name="robots" content="noindex,nofollow,noarchive" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Gia Lộc & Ngọc Quyên — Cuốn sách 4 năm" />
        <meta property="og:description" content="Một cuốn sách nhỏ lưu lại hành trình bốn năm của chúng mình." />
        <title>Gia Lộc & Ngọc Quyên — Cuốn sách 4 năm</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap"
            rel="stylesheet" />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <canvas id="sky"></canvas>
        <div class="aurora"></div>
        <main class="app">
            <header class="topbar">
                <div class="brand"><span class="mark">♡</span>Anh và Em</div>
                <div class="tools">
                    <button class="icon" id="home" title="Về bìa">⌂</button><button class="icon" id="music" title="Bật/tắt nhạc">♪</button>
                </div>
            </header>
            <section class="scene">
                <div class="book-wrap">
                    <div class="book" id="book">
                        <section class="paper left"><div class="paper-content" id="left"></div></section>
                        <section class="paper right"><div class="paper-content" id="right"></div></section>
                    </div>
                </div>
            </section>
            <footer class="controls">
                <div class="hint">Dùng phím ← → hoặc vuốt để lật trang</div>
                <div class="nav-center">
                    <button class="nav" id="prev" aria-label="Trang trước">‹</button><span class="progress" id="progress"></span
                    ><button class="nav" id="next" aria-label="Trang sau">›</button>
                </div>
                <div class="dots" id="dots"></div>
            </footer>
        </main>
        <section class="cover-screen" id="cover">
            <div class="cover-book">
                <div class="cover-inner">
                    <div class="ornament">✦ ❦ ✦</div>
                    <div class="cover-sub">Cuốn sách kỷ niệm</div>
                    <h1>Trần Gia Lộc <span>&</span> Hà Thị Ngọc Quyên</h1>
                    <div class="cover-sub">29.08.2022 · Bốn năm bên nhau</div>
                    <button class="open-btn" id="open">Mở cuốn sách&nbsp; →</button>
                </div>
            </div>
        </section>
        <div class="lightbox" id="lightbox"><button id="close">×</button><img id="zoom" alt="Ảnh kỷ niệm" /></div>
        <div class="love-celebration-message" id="loveMessage" aria-hidden="true">
            <span>Happy 4th anniversary</span>
            <strong>Anh yêu em ♡</strong>
        </div>
        <p class="sr-only" id="loveStatus" aria-live="polite"></p>
        <canvas id="celebrate" aria-hidden="true"></canvas>
        <audio id="audio" loop preload="metadata"></audio>
        <audio id="playlistAudio" preload="metadata"></audio>
        <!-- Chỉnh ảnh, video và nội dung trong data.js -->
        <script src="data.js"></script>
        <!-- Các hàm dựng sách và hiệu ứng nằm trong script.js -->
        <script src="script.js"></script>
    </body>
</html>
